<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Evolution Mission Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#05060f;--card:rgba(15,16,35,.75);--border:rgba(255,255,255,.08);
      --cyan:#00f3ff;--magenta:#ff00ff;--lime:#39ff14;--amber:#ffb300;
      --red:#ff3131;--text:#e0e0e0;--dim:#64748b;
      --font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;
      background-image:radial-gradient(circle at 2px 2px,rgba(255,255,255,.04) 1px,transparent 0);
      background-size:36px 36px;pointer-events:none;z-index:0}

    /* ── Layout ── */
    .shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh;position:relative;z-index:1}
    .sidebar{border-right:1px solid var(--border);background:rgba(0,0,0,.45);backdrop-filter:blur(20px);
      padding:24px 18px;display:flex;flex-direction:column;gap:12px;
      position:sticky;top:0;height:100vh;overflow-y:auto}
    .main{padding:28px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
    .brand{font-size:.9rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;
      background:linear-gradient(90deg,var(--cyan),var(--magenta));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
    h2{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
    .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);
      border-radius:18px;padding:22px}
    .card-title{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:16px}

    /* ── HERO PROGRESS CARD ── */
    .hero-card{background:linear-gradient(135deg,rgba(0,243,255,.06),rgba(255,0,255,.06));
      border:1px solid rgba(0,243,255,.2);border-radius:22px;padding:28px;position:relative;overflow:hidden}
    .hero-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;
      border-radius:50%;background:radial-gradient(circle,rgba(0,243,255,.12),transparent 70%);pointer-events:none}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
    .hero-gen{font-size:2.8rem;font-weight:800;line-height:1;
      background:linear-gradient(135deg,var(--cyan),var(--magenta));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero-gen-label{font-size:.6rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
    .hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

    /* ── Big circular progress ── */
    .circle-wrap{position:relative;width:110px;height:110px}
    .circle-wrap svg{transform:rotate(-90deg)}
    .circle-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:8}
    .circle-fill{fill:none;stroke-width:8;stroke-linecap:round;
      stroke-dasharray:283;stroke-dashoffset:283;
      transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
    .circle-center{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center}
    .circle-pct{font-size:1.3rem;font-weight:800;color:var(--cyan);line-height:1}
    .circle-sub{font-size:.5rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

    /* ── Main progress bar ── */
    .progress-section{margin-top:4px}
    .progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .progress-label{font-size:.85rem;font-weight:700;color:var(--text)}
    .progress-count{font-size:1.6rem;font-weight:800;color:var(--cyan);
      text-shadow:0 0 20px rgba(0,243,255,.5)}
    .progress-total{font-size:.85rem;color:var(--dim)}
    .big-bar-track{height:14px;background:rgba(255,255,255,.05);border-radius:10px;
      overflow:hidden;border:1px solid rgba(255,255,255,.06);position:relative}
    .big-bar-fill{height:100%;border-radius:10px;position:relative;
      background:linear-gradient(90deg,var(--cyan),var(--magenta));
      transition:width 1s cubic-bezier(.4,0,.2,1);
      box-shadow:0 0 20px rgba(0,243,255,.4)}
    .big-bar-fill::after{content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.3) 50%,transparent 100%);
      animation:shimmer 2s infinite}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)} }
    .seg-labels{display:flex;justify-content:space-between;margin-top:6px}
    .seg-label{font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px}

    /* ── Mini stats row ── */
    .mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
    .mini-stat{background:rgba(255,255,255,.03);border:1px solid var(--border);
      border-radius:12px;padding:12px;text-align:center;transition:.3s}
    .mini-stat:hover{border-color:var(--cyan);background:rgba(0,243,255,.05)}
    .mini-val{font-size:1.4rem;font-weight:800;line-height:1}
    .mini-label{font-size:.52rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:3px}

    /* ── Live ticker ── */
    .ticker-wrap{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:12px;
      padding:10px 16px;display:flex;align-items:center;gap:10px;margin-top:14px;min-height:40px}
    .ticker-dot{width:8px;height:8px;border-radius:50%;background:var(--lime);flex-shrink:0;
      animation:dotpulse 1.2s ease-in-out infinite}
    .ticker-text{font-family:var(--mono);font-size:.65rem;color:var(--cyan);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ── Segment breakdown ── */
    .seg-bars{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:1px;margin-top:10px}
    .seg-pass{background:var(--lime);flex-shrink:0;transition:flex .8s ease}
    .seg-fail{background:var(--red);flex-shrink:0;transition:flex .8s ease}
    .seg-pend{background:rgba(255,255,255,.08);flex:1}

    /* ── Badges ── */
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;
      font-size:.58rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid}
    .badge-running{color:var(--lime);border-color:var(--lime);background:rgba(57,255,20,.08)}
    .badge-done{color:var(--cyan);border-color:var(--cyan);background:rgba(0,243,255,.08)}
    .badge-spawning{color:var(--amber);border-color:var(--amber);background:rgba(255,179,0,.08)}
    .badge-fail{color:var(--red);border-color:var(--red);background:rgba(255,49,49,.08)}
    .badge-idle{color:var(--dim);border-color:var(--dim);background:rgba(255,255,255,.04)}
    .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .dot-pulse{animation:dotpulse 1.2s ease-in-out infinite}
    @keyframes dotpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

    /* ── Timeline ── */
    .timeline{display:flex;align-items:center;flex-wrap:wrap;padding:6px 0;gap:0}
    .tl-node{display:flex;flex-direction:column;align-items:center;cursor:pointer}
    .tl-circle{width:52px;height:52px;border-radius:50%;border:2px solid var(--border);
      background:var(--card);display:flex;align-items:center;justify-content:center;
      font-size:.68rem;font-weight:800;transition:.3s;position:relative;flex-direction:column;gap:1px}
    .tl-circle:hover,.tl-circle.active{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,243,255,.3)}
    .tl-circle.live{border-color:var(--lime);box-shadow:0 0 18px rgba(57,255,20,.3)}
    .tl-circle.live::after{content:'';position:absolute;inset:-5px;border-radius:50%;
      border:1px solid var(--lime);opacity:.5;animation:ringpulse 2s infinite}
    @keyframes ringpulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}

    /* ── Spinner ── */
    .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(57,255,20,.2);
      border-top-color:var(--lime);animation:spin .8s linear infinite;flex-shrink:0}
    .spinner-cyan{border-color:rgba(0,243,255,.2);border-top-color:var(--cyan)}
    .spinner-sm{width:12px;height:12px;border-width:2px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Spinner inside gen button */
    .gen-btn-header{display:flex;align-items:center;gap:7px}
    .tl-label{font-size:.52rem;color:var(--dim);margin-top:5px;text-align:center;line-height:1.3}
    .tl-pct{font-size:.5rem;color:var(--cyan)}
    .tl-line{flex:1;height:2px;min-width:16px;background:var(--border);margin-bottom:20px}
    .tl-line.done{background:linear-gradient(90deg,var(--cyan),rgba(0,243,255,.3))}

    /* ── Sidebar gen buttons ── */
    .gen-btn{padding:10px 12px;border-radius:12px;border:1px solid var(--border);
      background:var(--card);cursor:pointer;transition:.3s;position:relative;overflow:hidden}
    .gen-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--border);transition:.3s}
    .gen-btn:hover{border-color:var(--cyan);transform:translateX(3px)}
    .gen-btn:hover::before,.gen-btn.active::before{background:var(--cyan)}
    .gen-btn.active{border-color:var(--cyan);background:rgba(0,243,255,.08);box-shadow:0 0 20px rgba(0,243,255,.08)}
    .gen-btn-title{font-size:.7rem;font-weight:700;margin-bottom:3px}
    .gen-btn-sub{font-size:.56rem;color:var(--dim)}
    /* mini progress inside sidebar button */
    .gen-btn-bar{height:2px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:6px;overflow:hidden}
    .gen-btn-bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .8s ease}

    /* ── Tabs ── */
    .tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
    .tab-btn{background:none;border:none;color:var(--dim);font-size:.65rem;font-weight:700;
      padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;letter-spacing:.04em}
    .tab-btn:hover{color:var(--fg)}
    .tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}
    .summary-section{margin-bottom:14px}
    .summary-title{font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .summary-desc{font-size:.75rem;color:var(--fg);line-height:1.5;margin-bottom:12px}
    .check-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.65rem}
    .check-icon{width:18px;text-align:center;font-size:.75rem;flex-shrink:0}
    .phase-check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
    .phase-check{padding:8px 10px;border-radius:8px;border:1px solid var(--border);text-align:center;font-size:.62rem}
    .phase-check.ok{border-color:rgba(57,255,20,.3);background:rgba(57,255,20,.06);color:var(--lime)}
    .phase-check.fail{border-color:rgba(255,49,49,.3);background:rgba(255,49,49,.06);color:var(--red)}
    .phase-check.pend{color:var(--dim)}
    .code-wrap{background:#0a0a0f;border:1px solid var(--border);border-radius:8px;
      overflow:auto;max-height:420px;padding:14px;position:relative}
    .code-wrap pre{margin:0;font-size:.65rem;font-family:var(--mono);line-height:1.6;
      color:#e2e8f0;white-space:pre;overflow-x:auto}
    .code-copy-btn{position:absolute;top:8px;right:8px;background:rgba(0,243,255,.12);
      border:1px solid rgba(0,243,255,.3);color:var(--cyan);font-size:.58rem;padding:3px 8px;
      border-radius:6px;cursor:pointer}
    .code-copy-btn:hover{background:rgba(0,243,255,.25)}
    /* ── Task phase progress bar ── */
    .phase-bar-wrap{margin-top:14px}
    .phase-bar-label{font-size:.52rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .phase-steps{display:flex;align-items:flex-start;gap:0;overflow-x:auto}
    .phase-step{flex:1;min-width:52px;text-align:center;padding:6px 2px 4px;
      border-top:2px solid rgba(255,255,255,.08);cursor:default;transition:.3s}
    .phase-step.ps-done{border-top-color:var(--lime)}
    .phase-step.ps-active{border-top-color:var(--cyan)}
    .phase-step.ps-skip{opacity:.2}
    .phase-step-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12);
      margin:0 auto 4px;transition:.3s}
    .phase-step.ps-done .phase-step-dot{background:var(--lime)}
    .phase-step.ps-active .phase-step-dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan);
      animation:dotPulse 1.2s infinite}
    .phase-step-txt{font-size:.48rem;color:var(--dim);line-height:1.3;transition:.3s}
    .phase-step.ps-done .phase-step-txt{color:var(--lime)}
    .phase-step.ps-active .phase-step-txt{color:var(--cyan);font-weight:700}
    @keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.6}}

    /* ── Topology node diagram ── */
    .pipeline-flow{display:flex;align-items:center;overflow-x:auto;padding:10px 0;gap:0;flex-wrap:nowrap}
    .pipe-node{display:flex;flex-direction:column;align-items:center;gap:5px;
      padding:14px 10px 10px;border-radius:14px;border:2px solid var(--border);
      background:#0d0d18;min-width:80px;text-align:center;transition:.3s;flex-shrink:0;position:relative}
    .pipe-node.pn-always{border-color:rgba(0,243,255,.4);background:rgba(0,243,255,.05)}
    .pipe-node.pn-on{border-color:rgba(57,255,20,.4);background:rgba(57,255,20,.04)}
    .pipe-node.pn-off{opacity:.18;filter:grayscale(1)}
    .pipe-node.pn-active{border-color:var(--cyan)!important;background:rgba(0,243,255,.12)!important;
      box-shadow:0 0 24px rgba(0,243,255,.5);animation:nodeGlow 1.4s infinite}
    .pipe-node-icon{font-size:1.5rem;line-height:1}
    .pipe-node-label{font-size:.6rem;font-weight:800;color:var(--fg);letter-spacing:.02em}
    .pipe-node-badge{font-size:.48rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-top:2px}
    .pnb-core{background:rgba(0,243,255,.15);color:var(--cyan)}
    .pnb-on{background:rgba(57,255,20,.15);color:var(--lime)}
    .pnb-off{background:rgba(255,255,255,.06);color:var(--dim)}
    .pipe-conn{display:flex;flex-direction:column;align-items:center;justify-content:center;
      flex-shrink:0;padding:0 2px;gap:1px}
    .pipe-conn-line{height:2px;width:24px;background:rgba(255,255,255,.12);border-radius:2px}
    .pipe-conn-line.pc-active{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
    .pipe-conn-arrow{font-size:.7rem;color:rgba(255,255,255,.2);margin-top:-2px}
    .pipe-conn-arrow.pc-active{color:var(--cyan)}
    .pipe-cycle-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);
      font-size:.46rem;background:var(--amber);color:#000;padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:700}
    @keyframes nodeGlow{0%,100%{box-shadow:0 0 24px rgba(0,243,255,.5)}
      50%{box-shadow:0 0 40px rgba(0,243,255,.85)}}

    /* ── Sidebar task list ── */
    .sb-task-list{display:flex;flex-direction:column;gap:1px;margin-top:8px;
      max-height:320px;overflow-y:auto;border-top:1px solid var(--border);padding-top:6px}
    .sb-task-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;
      font-size:.6rem;font-family:var(--mono)}
    .sb-task-row.t-run{background:rgba(0,243,255,.08);border:1px solid rgba(0,243,255,.2)}
    .sb-task-row.t-pass{opacity:.55}
    .sb-task-row.t-fail{background:rgba(255,49,49,.07);cursor:pointer}
    .sb-task-row.t-fail:hover{background:rgba(255,49,49,.15)}
    .sb-task-row.t-pend{opacity:.2}
    .sb-task-icon{width:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .sb-task-id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sb-task-err{font-size:.54rem;color:var(--red);flex-shrink:0;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── Gen detail stats ── */
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .stat{border-left:2px solid var(--border);padding:8px 12px;transition:.3s}
    .stat:hover{border-left-color:var(--cyan)}
    .stat-val{font-size:1.9rem;font-weight:800;color:var(--cyan);text-shadow:0 0 12px rgba(0,243,255,.3);line-height:1}
    .stat-label{font-size:.52rem;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}

    /* ── Table ── */
    .filter-bar{display:flex;gap:7px;margin-bottom:12px}
    .filter-btn{padding:4px 11px;border-radius:6px;border:1px solid var(--border);
      background:transparent;color:var(--dim);font-size:.58rem;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s;font-family:var(--font)}
    .filter-btn:hover,.filter-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,243,255,.08)}
    table{width:100%;border-collapse:separate;border-spacing:0 5px;font-family:var(--mono);font-size:.68rem}
    th{text-align:left;padding:9px 13px;color:var(--dim);font-size:.58rem;letter-spacing:1px;
      text-transform:uppercase;border-bottom:1px solid var(--border)}
    td{padding:9px 13px;background:rgba(255,255,255,.02);
      border-top:1px solid var(--border);border-bottom:1px solid var(--border);transition:.2s}
    tr td:first-child{border-left:1px solid var(--border);border-radius:8px 0 0 8px}
    tr td:last-child{border-right:1px solid var(--border);border-radius:0 8px 8px 0}
    tr:hover td{background:rgba(0,243,255,.04);border-color:rgba(0,243,255,.2);cursor:pointer}
    .pill{padding:2px 7px;border-radius:5px;font-size:.56rem;font-weight:700;
      text-transform:uppercase;border:1px solid}
    .pass-pill{color:var(--lime);border-color:var(--lime);background:rgba(57,255,20,.08)}
    .fail-pill{color:var(--red);border-color:var(--red);background:rgba(255,49,49,.08)}

    /* ── Breakdown bars ── */
    .breakdown{display:flex;flex-direction:column;gap:8px}
    .bd-row{display:flex;align-items:center;gap:10px}
    .bd-label{font-size:.63rem;font-family:var(--mono);min-width:140px}
    .bd-track{flex:1;height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
    .bd-fill{height:100%;border-radius:3px;transition:width .8s ease}
    .bd-count{font-size:.58rem;color:var(--dim);min-width:22px;text-align:right}

    /* ── Matrix ── */
    .matrix-wrap{overflow-x:auto}
    .matrix-table{border-spacing:3px}
    .matrix-table th{font-size:.56rem;padding:5px 8px;white-space:nowrap}
    .matrix-table td{padding:4px 8px;border-radius:5px;text-align:center;
      font-size:.58rem;font-weight:700;border:none;min-width:48px}
    .m-pass{background:rgba(57,255,20,.15);color:var(--lime)}
    .m-fail{background:rgba(255,49,49,.12);color:var(--red)}
    .m-new{background:rgba(0,243,255,.2);color:var(--cyan)}
    .m-reg{background:rgba(255,179,0,.2);color:var(--amber)}
    .m-none{background:rgba(255,255,255,.03);color:var(--dim)}

    /* ── Evo entry ── */
    .evo-entry{border-left:3px solid var(--border);padding:12px 16px;margin-bottom:14px;
      background:rgba(255,255,255,.02);border-radius:0 10px 10px 0;transition:.3s}
    .evo-entry.improved{border-left-color:var(--lime)}
    .evo-entry.regressed{border-left-color:var(--red)}
    .evo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .evo-title{font-size:.78rem;font-weight:700}
    .delta-pos{color:var(--lime);font-weight:700}
    .delta-neg{color:var(--red);font-weight:700}
    .delta-pend{color:var(--dim)}
    .evo-meta{font-size:.58rem;color:var(--dim);margin-bottom:6px}
    .evo-changes{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
    .change-tag{padding:2px 7px;border-radius:4px;font-size:.56rem;font-weight:600;
      background:rgba(0,243,255,.1);color:var(--cyan);border:1px solid rgba(0,243,255,.2)}
    .evo-log{font-size:.63rem;color:var(--dim);line-height:1.5;margin-top:5px;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .attr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
    .attr-item{padding:10px;border:1px solid var(--border);border-radius:10px;text-align:center;transition:.3s}
    .attr-item:hover{border-color:var(--magenta)}
    .attr-count{font-size:1.4rem;font-weight:800;color:var(--magenta);line-height:1}
    .attr-name{font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:3px}

    /* ── Drawer ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
      z-index:999;opacity:0;pointer-events:none;transition:.3s}
    .overlay.show{opacity:1;pointer-events:all}
    .drawer{position:fixed;top:0;right:-900px;width:800px;height:100vh;
      background:#070815;border-left:1px solid var(--border);z-index:1000;
      transition:transform .5s cubic-bezier(.16,1,.3,1);padding:36px;overflow-y:auto;
      box-shadow:-20px 0 60px rgba(0,0,0,.6)}
    .drawer.open{transform:translateX(-900px)}
    pre{background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:10px;
      padding:14px;font-size:.67rem;overflow-x:auto;white-space:pre-wrap;line-height:1.5}
    .close-btn{position:absolute;top:18px;right:18px;background:transparent;
      border:1px solid var(--border);color:var(--dim);border-radius:8px;
      padding:5px 11px;cursor:pointer;font-size:.67rem;font-family:var(--font)}
    .close-btn:hover{border-color:var(--red);color:var(--red)}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(0,243,255,.4)}

    /* ── Animated number ── */
    @keyframes numPop{0%{transform:scale(1.3);opacity:.5}100%{transform:scale(1);opacity:1}}
    .num-pop{animation:numPop .4s ease}

    /* ── ETA chip ── */
    .eta-chip{background:rgba(255,179,0,.1);border:1px solid rgba(255,179,0,.3);
      border-radius:8px;padding:4px 10px;font-size:.58rem;color:var(--amber);font-family:var(--mono)}

    /* ── Task list ── */
    .task-list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
    .task-row{display:flex;align-items:center;gap:10px;padding:6px 10px;
      border-radius:8px;font-size:.63rem;font-family:var(--mono);transition:.15s}
    .task-row.t-run{background:rgba(0,243,255,.06);border:1px solid rgba(0,243,255,.18)}
    .task-row.t-pass{opacity:.6}
    .task-row.t-fail{background:rgba(255,49,49,.05);cursor:pointer}
    .task-row.t-fail:hover{background:rgba(255,49,49,.12);border:1px solid rgba(255,49,49,.2)}
    .task-row.t-pend{opacity:.22}
    .task-icon{width:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .task-id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .task-err{font-size:.56rem;color:var(--red);white-space:nowrap;flex-shrink:0}
    .task-rt{font-size:.52rem;color:var(--dim);white-space:nowrap;flex-shrink:0}
    /* Collapse */
    .collapse-hdr{display:flex;justify-content:space-between;align-items:center;
      cursor:pointer;padding:4px 0;user-select:none}
    .collapse-hdr:hover .collapse-btn{border-color:var(--cyan);color:var(--cyan)}
    .collapse-btn{background:none;border:1px solid var(--border);color:var(--dim);
      border-radius:6px;padding:3px 10px;font-size:.55rem;cursor:pointer;
      font-family:var(--font);transition:.2s;white-space:nowrap}

    /* ── Live activity line ── */
    .activity-wrap{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .activity-text{font-family:var(--mono);font-size:.63rem;color:var(--text);
      animation:fadein .3s ease}
    @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    /* result badges */
    .prb{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;
      font-size:.53rem;font-weight:700;border:1px solid;text-transform:uppercase;letter-spacing:.4px;
      font-family:var(--mono)}
    .prb-pass{color:var(--lime);border-color:rgba(57,255,20,.3);background:rgba(57,255,20,.08)}
    .prb-fail{color:var(--red);border-color:rgba(255,49,49,.3);background:rgba(255,49,49,.08)}
    .prb-pend{color:var(--dim);border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
  </style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="close-btn" onclick="closeDrawer()">✕ Close</button>
  <div id="drawer-content"></div>
</div>

<div class="shell">
  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="brand">Evolution<br>Control</div>
    <div id="live-badge"></div>
    <div style="font-size:.54rem;color:var(--dim);margin-top:-4px" id="last-upd-label">Polling…</div>
    <div style="height:1px;background:var(--border);margin:4px 0"></div>
    <h2>Generations</h2>
    <div id="gen-nav" style="display:flex;flex-direction:column;gap:8px"></div>
    <div style="height:1px;background:var(--border);margin:8px 0"></div>
    <a href="/code" target="_blank" style="display:flex;align-items:center;gap:8px;padding:9px 12px;
      border-radius:10px;border:1px solid rgba(0,243,255,.2);background:rgba(0,243,255,.05);
      color:var(--cyan);text-decoration:none;font-size:.65rem;font-weight:700;transition:.2s"
      onmouseover="this.style.background='rgba(0,243,255,.12)'"
      onmouseout="this.style.background='rgba(0,243,255,.05)'">
      <span>📂</span><span>Code Browser</span>
    </a>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main">

    <!-- TIMELINE — at top so spinner is immediately visible -->
    <div class="card" style="padding:14px 22px">
      <div class="card-title" style="margin-bottom:10px">📍 Generation Timeline</div>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- GEN DETAIL -->
    <div id="gen-detail"></div>

    <!-- HERO PROGRESS CARD -->
      <div class="hero-top">
        <div>
          <div class="hero-gen" id="hero-gen-num">Gen 1</div>
          <div class="hero-gen-label">Active Generation</div>
          <div style="margin-top:10px" id="hero-badge"></div>
        </div>
        <div class="hero-right">
          <div class="circle-wrap">
            <svg width="110" height="110" viewBox="0 0 110 110">
              <circle class="circle-bg" cx="55" cy="55" r="45"/>
              <circle class="circle-fill" id="circle-fill" cx="55" cy="55" r="45"
                stroke="url(#cg)" stroke-dashoffset="283"/>
              <defs>
                <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#00f3ff"/>
                  <stop offset="100%" stop-color="#ff00ff"/>
                </linearGradient>
              </defs>
            </svg>
            <div class="circle-center">
              <div class="circle-pct" id="circle-pct">0%</div>
              <div class="circle-sub">Done</div>
            </div>
          </div>
          <div id="eta-chip"></div>
        </div>
      </div>

      <!-- Generation progress bar -->
      <div class="progress-section">
        <div class="progress-meta">
          <div class="progress-label">Generation Progress</div>
          <div>
            <span class="progress-count" id="pbar-done">0</span>
            <span class="progress-total" id="pbar-total"> / 0</span>
          </div>
        </div>
        <div class="big-bar-track">
          <div class="big-bar-fill" id="big-bar-fill" style="width:0%"></div>
        </div>
        <div class="seg-bars" id="seg-bars">
          <div class="seg-pend" style="flex:1"></div>
        </div>
        <div class="seg-labels">
          <span class="seg-label" style="color:var(--lime)" id="seg-pass-label">0 passed</span>
          <span class="seg-label" style="color:var(--red)" id="seg-fail-label">0 failed</span>
          <span class="seg-label" id="seg-pend-label">0 pending</span>
        </div>
      </div>

      <!-- Task phase progress bar -->
      <div class="phase-bar-wrap" id="phase-bar-wrap" style="display:none">
        <div class="phase-bar-label">Current Task — <span id="phase-task-id" style="color:var(--cyan)"></span></div>
        <div class="phase-steps" id="phase-steps"></div>
      </div>

      <!-- Pipeline Topology — inline inside hero card -->
      <div id="topology-inline" style="display:none;margin-top:16px">
        <div style="font-size:.52rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">🔧 Pipeline Topology — Generation <span id="topo-gen-num">1</span></div>
        <div id="topology-content"></div>
      </div>

      <!-- Live ticker -->
      <div class="ticker-wrap" id="ticker-wrap">
        <div class="ticker-dot" id="ticker-dot"></div>
        <div class="ticker-text" id="ticker-text">Waiting for evolution to start…</div>
      </div>

      <!-- Live activity (phase text + result badges) — shown only when RUNNING -->
      <div class="activity-wrap" id="activity-wrap" style="display:none">
        <div class="spinner spinner-cyan" style="width:10px;height:10px;flex-shrink:0"></div>
        <div class="activity-text" id="activity-text"></div>
        <div id="activity-badges" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>

      <!-- Mini stats -->
      <div class="mini-stats">
        <div class="mini-stat">
          <div class="mini-val" style="color:var(--lime)" id="ms-passed">0</div>
          <div class="mini-label">Passed</div>
        </div>
        <div class="mini-stat">
          <div class="mini-val" style="color:var(--red)" id="ms-failed">0</div>
          <div class="mini-label">Failed</div>
        </div>
        <div class="mini-stat">
          <div class="mini-val" style="color:var(--cyan)" id="ms-rate">—</div>
          <div class="mini-label">Pass Rate</div>
        </div>
        <div class="mini-stat">
          <div class="mini-val" style="color:var(--amber)" id="ms-gen">1</div>
          <div class="mini-label">Generation</div>
        </div>
      </div>
    </div>

    <!-- TASK SUMMARY + CODE TABS -->
    <div class="card" id="task-tabs-card" style="display:none">
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-btn-summary" onclick="switchTab('summary')">📋 Summary</button>
        <button class="tab-btn" id="tab-btn-code" onclick="switchTab('code')">💻 Code Generated</button>
      </div>
      <div id="tab-pane-summary"></div>
      <div id="tab-pane-code" style="display:none"></div>
    </div>


  </main>
</div>

<script>
var STATE={heartbeat:null,evolutionLog:[],benchmarkMatrix:null,activeGen:null,
  genProgress:{},   // gen_num → {task_list, results, descriptions}
  collapsed:new Set(),  // gens collapsed by user or auto
  userExpanded:new Set(), // gens user explicitly opened
  activeTab:'summary',   // 'summary' | 'code'
  lastCode:null          // {gen, task_id, final_code, stdout, stderr, error_type, phase_results}
};
var PREV_TASK='';
var TASK_START=null;
var COLORS=['#00f3ff','#ff00ff','#39ff14','#ffb300','#ff3131','#a78bfa','#fb7185'];

async function loadJSON(p){
  try{var r=await fetch(p+'?_='+Date.now());if(!r.ok)return null;return await r.json();}
  catch(e){return null;}
}

async function refresh(){
  var results=await Promise.all([
    loadJSON('data/heartbeat.json'),
    loadJSON('data/evolution_log.json'),
    loadJSON('data/benchmark_matrix.json')
  ]);
  if(results[0])STATE.heartbeat=results[0];
  if(results[1])STATE.evolutionLog=Array.isArray(results[1])?results[1]:[];
  if(results[2])STATE.benchmarkMatrix=results[2];

  // Load progress for all known gens
  var knownGens=getKnownGens();
  await Promise.all(knownGens.map(async function(g){
    var p=await loadJSON('data/gen_'+g+'_progress.json');
    if(p)STATE.genProgress[g]=p;
  }));

  // Auto-collapse gens that are no longer active (unless user explicitly expanded)
  if(STATE.heartbeat){
    var ag=STATE.heartbeat.active_gen||1;
    knownGens.forEach(function(g){
      if(g<ag&&!STATE.userExpanded.has(g))STATE.collapsed.add(g);
    });
  }

  if(STATE.activeGen===null&&STATE.heartbeat)STATE.activeGen=STATE.heartbeat.active_gen||1;
  renderAll();
  document.getElementById('last-upd-label').textContent='Updated '+new Date().toLocaleTimeString();
}

function renderAll(){
  renderHero();
  renderSidebarNav();
  renderTimeline();
  if(STATE.activeGen!==null)renderGenDetail(STATE.activeGen);
  renderTaskTabs();
  renderTopology();
}

/* ══ TABS: SUMMARY + CODE ══ */
function switchTab(tab){
  STATE.activeTab=tab;
  ['summary','code'].forEach(function(t){
    document.getElementById('tab-btn-'+t).classList.toggle('active',t===tab);
    document.getElementById('tab-pane-'+t).style.display=t===tab?'block':'none';
  });
  if(tab==='code') fetchAndRenderCode();
}

function renderTaskTabs(){
  var hb=STATE.heartbeat;
  var card=document.getElementById('task-tabs-card');
  if(!hb||(hb.status!=='RUNNING'&&hb.status!=='ANALYSING')){card.style.display='none';return;}
  card.style.display='block';
  if(STATE.activeTab==='summary') renderSummaryPane();
  else fetchAndRenderCode();
}

function renderSummaryPane(){
  var hb=STATE.heartbeat;
  if(!hb)return;
  var gen=hb.active_gen;
  var tid=hb.active_task_id||'';
  var progress=STATE.genProgress[gen]||{};
  var descs=progress.descriptions||{};
  var desc=descs[tid]||tid||'—';
  var pr=hb.phase_results||{};
  var phase=hb.current_phase||'';

  // What went right
  var rights=[];
  if(pr.compile===true) rights.push('Compilation passed');
  if(pr.unit_tests===true) rights.push('Unit tests passed');
  if(pr.integration_tests===true) rights.push('Integration tests passed');

  // What went wrong
  var wrongs=[];
  if(pr.compile===false) wrongs.push('Compilation failed');
  if(pr.unit_tests===false) wrongs.push('Unit tests failed');
  if(pr.integration_tests===false) wrongs.push('Integration tests failed');

  function phaseBox(label,val){
    var cls=val===true?'ok':val===false?'fail':'pend';
    var icon=val===true?'✓':val===false?'✗':'—';
    return '<div class="phase-check '+cls+'"><div style="font-size:.9rem">'+icon+'</div><div>'+label+'</div></div>';
  }

  var html=
    '<div class="summary-section">'+
      '<div class="summary-title">Current Task</div>'+
      '<div class="summary-desc">'+desc+
        (tid?'<span style="font-size:.58rem;color:var(--dim);margin-left:8px">'+tid+'</span>':'')+
      '</div>'+
      (phase?'<div style="font-size:.62rem;color:var(--cyan);margin-bottom:10px">'+phaseLabel(phase)+'</div>':'')+
    '</div>'+
    '<div class="phase-check-grid">'+
      phaseBox('Compilation',pr.compile===undefined?null:pr.compile)+
      phaseBox('Unit Tests',pr.unit_tests===undefined?null:pr.unit_tests)+
      phaseBox('Integration Tests',pr.integration_tests===undefined?null:pr.integration_tests)+
    '</div>';

  if(rights.length){
    html+='<div style="margin-top:14px"><div class="summary-title" style="color:var(--lime)">✅ What Went Right</div>'+
      rights.map(function(r){return '<div class="check-row"><span class="check-icon" style="color:var(--lime)">✓</span>'+r+'</div>';}).join('')+
    '</div>';
  }
  if(wrongs.length){
    html+='<div style="margin-top:10px"><div class="summary-title" style="color:var(--red)">❌ What Went Wrong</div>'+
      wrongs.map(function(w){return '<div class="check-row"><span class="check-icon" style="color:var(--red)">✗</span>'+w+'</div>';}).join('')+
    '</div>';
  }
  if(!rights.length&&!wrongs.length&&!phase){
    html+='<div style="color:var(--dim);font-size:.65rem;margin-top:10px">Waiting for task to start…</div>';
  }

  document.getElementById('tab-pane-summary').innerHTML=html;
}

async function fetchAndRenderCode(){
  var hb=STATE.heartbeat;
  if(!hb)return;
  var gen=hb.active_gen;
  // Show code for last completed task (most recently in progress.results) or active task
  var progress=STATE.genProgress[gen]||{};
  var completed=Object.keys(progress.results||{});
  var tid=completed.length?completed[completed.length-1]:(hb.active_task_id||'');
  if(!tid){document.getElementById('tab-pane-code').innerHTML='<div style="color:var(--dim);font-size:.65rem">No completed tasks yet.</div>';return;}

  // Use cache if same task
  if(STATE.lastCode&&STATE.lastCode.gen===gen&&STATE.lastCode.task_id===tid){
    _renderCodePane(STATE.lastCode);return;
  }
  document.getElementById('tab-pane-code').innerHTML='<div style="color:var(--dim);font-size:.65rem">Loading…</div>';
  var result=await loadJSON('generations/gen_'+gen+'/results/'+tid+'_result.json');
  if(result){
    STATE.lastCode={gen:gen,task_id:tid,final_code:result.final_code||'',
      stdout:result.stdout||'',stderr:result.stderr||'',
      error_type:result.error_type||'',phase_results:result.phase_results||{}};
    _renderCodePane(STATE.lastCode);
  } else {
    document.getElementById('tab-pane-code').innerHTML='<div style="color:var(--dim);font-size:.65rem">Result file not available yet.</div>';
  }
}

function _renderCodePane(data){
  var desc=(STATE.genProgress[data.gen]&&STATE.genProgress[data.gen].descriptions&&STATE.genProgress[data.gen].descriptions[data.task_id])||data.task_id;
  var code=data.final_code||'';
  var escaped=code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var html='<div style="font-size:.6rem;color:var(--dim);margin-bottom:8px">Last completed: <span style="color:var(--cyan)">'+desc+'</span></div>'+
    '<div class="code-wrap">'+
      '<button class="code-copy-btn" onclick="copyCode(this)">Copy</button>'+
      '<pre>'+escaped+'</pre>'+
    '</div>';
  if(data.stderr){
    var errEsc=data.stderr.slice(0,600).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html+='<div style="margin-top:12px"><div class="summary-title" style="color:var(--red)">Stderr</div>'+
      '<div class="code-wrap" style="max-height:160px"><pre style="color:#fc8181">'+errEsc+'</pre></div></div>';
  }
  document.getElementById('tab-pane-code').innerHTML=html;
}

function copyCode(btn){
  var pre=btn.nextElementSibling;
  if(navigator.clipboard){navigator.clipboard.writeText(pre.textContent);}
  btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy';},1500);
}

/* ══ PHASE STEPS (task-level progress bar) ══ */
var PHASE_ORDER=[
  {phase:'thinking',      label:'Think',     agent:'analyst'},
  {phase:'writing_unit_tests',label:'Write Tests',agent:'test_writer'},
  {phase:'writing_code',  label:'Code',      agent:'coder'},
  {phase:'reviewing',     label:'Review',    agent:'critic'},
  {phase:'revising',      label:'Revise',    agent:'reviser'},
  {phase:'compiling',     label:'Compile',   agent:'executor'},
  {phase:'running_unit_tests',label:'Run Tests',agent:'executor'},
  {phase:'debugging',     label:'Debug',     agent:'debugger'},
  {phase:'running_integration_tests',label:'Integ.',agent:'executor'}
];
var PHASE_TO_IDX={};
PHASE_ORDER.forEach(function(p,i){PHASE_TO_IDX[p.phase]=i;});

function renderPhaseSteps(currentPhase,topo){
  var activeIdx=PHASE_TO_IDX[currentPhase];
  if(activeIdx===undefined)activeIdx=-1;
  return PHASE_ORDER.map(function(p,i){
    // Hide disabled optional agents
    var agentKey='enable_'+p.agent;
    var optional=(p.agent==='test_writer'||p.agent==='critic'||p.agent==='reviser'||p.agent==='debugger');
    var enabled=!optional||(topo[agentKey]===true||topo[agentKey]==='true');
    var cls=!enabled?'ps-skip':i<activeIdx?'ps-done':i===activeIdx?'ps-active':'';
    return '<div class="phase-step '+cls+'">'+
      '<div class="phase-step-dot"></div>'+
      '<div class="phase-step-txt">'+p.label+'</div>'+
    '</div>';
  }).join('');
}

/* ══ TOPOLOGY — node diagram ══ */
var PHASE_TO_AGENT={
  'thinking':'analyst','writing_unit_tests':'test_writer','writing_code':'coder',
  'reviewing':'critic','revising':'reviser','compiling':'executor',
  'running_unit_tests':'executor','debugging':'debugger','running_integration_tests':'executor'
};

function renderTopology(){
  var hb=STATE.heartbeat;
  var wrap=document.getElementById('topology-inline');
  if(!hb||!hb.topology||!Object.keys(hb.topology).length){wrap.style.display='none';return;}
  wrap.style.display='block';
  document.getElementById('topo-gen-num').textContent=hb.active_gen;
  var t=hb.topology;
  var activeAgent=PHASE_TO_AGENT[hb.current_phase]||'';

  // Pipeline node definitions in flow order
  var nodes=[
    {id:'analyst',    label:'Analyst',     icon:'🧠', always:true},
    {id:'architect',  label:'Architect',   icon:'🏗️', always:true},
    {id:'test_writer',label:'Test Writer', icon:'🧪', key:'enable_test_writer'},
    {id:'coder',      label:'Coder',       icon:'💻', always:true},
    {id:'critic',     label:'Critic',      icon:'🔍', key:'enable_critic'},
    {id:'reviser',    label:'Reviser',     icon:'✏️', key:'enable_reviser'},
    {id:'executor',   label:'Executor',    icon:'▶️', always:true},
    {id:'debugger',   label:'Debugger',    icon:'🔧', key:'enable_debugger'},
  ];

  var parts=[];
  nodes.forEach(function(n,i){
    var on=n.always||(t[n.key]===true||t[n.key]==='true');
    var isActive=n.id===activeAgent&&hb.status==='RUNNING';
    var nodeCls='pipe-node '+(isActive?'pn-active ':'')+( n.always?'pn-always':(on?'pn-on':'pn-off'));
    var badgeCls=n.always?'pnb-core':(on?'pnb-on':'pnb-off');
    var badgeTxt=n.always?'core':(on?'ON':'OFF');

    // Cycle badge for Critic (shows ⟳N between Critic and Reviser)
    var cycleBadge='';
    if(n.id==='critic'&&on&&(t['enable_reviser']===true||t['enable_reviser']==='true')){
      cycleBadge='<div class="pipe-cycle-badge">⟳ '+(t.max_critic_reviser_cycles||'N')+' cycles</div>';
    }

    parts.push(
      '<div class="'+nodeCls+'">'+
        cycleBadge+
        '<div class="pipe-node-icon">'+n.icon+'</div>'+
        '<div class="pipe-node-label">'+n.label+'</div>'+

    );

/* ══ HERO CARD ══ */
function renderHero(){
  var hb=STATE.heartbeat;
  if(!hb){
    document.getElementById('hero-gen-num').textContent='Gen —';
    return;
  }

  // Generation number
  document.getElementById('hero-gen-num').textContent='Gen '+hb.active_gen;
  document.getElementById('ms-gen').textContent=hb.active_gen;

  // Badge
  var map={RUNNING:['badge-running',true,'🟢 Running'],ANALYSING:['badge-spawning',true,'🔍 Analysing'],
    SPAWNING:['badge-spawning',true,'🚀 Spawning'],DONE:['badge-done',false,'✅ Done'],
    SPAWN_FAILED:['badge-fail',false,'❌ Spawn Failed']};
  var info=map[hb.status]||['badge-idle',false,'⏸ Idle'];
  document.getElementById('hero-badge').innerHTML=
    '<span class="badge '+info[0]+'"><span class="dot'+(info[1]?' dot-pulse':'')+'"></span>'+info[2]+'</span>';
  document.getElementById('live-badge').innerHTML=
    '<span class="badge '+info[0]+'" style="font-size:.52rem"><span class="dot'+(info[1]?' dot-pulse':'')+'"></span>Gen '+hb.active_gen+' · '+hb.status+'</span>';

  // Parse progress
  var parts=(hb.progress||'0/0').split('/').map(Number);
  var done=parts[0]||0, total=parts[1]||0;
  var pct=total?done/total:0;
  var passed=hb.passed_so_far||0, failed=hb.failed_so_far||0, pending=Math.max(0,total-done);

  // Big bar
  document.getElementById('pbar-done').textContent=done;
  document.getElementById('pbar-total').textContent=' / '+total;
  document.getElementById('big-bar-fill').style.width=pct2str(pct);

  // Segmented bar
  if(total>0){
    var pPct=(passed/total*100).toFixed(1)+'%';
    var fPct=(failed/total*100).toFixed(1)+'%';
    document.getElementById('seg-bars').innerHTML=
      '<div class="seg-pass" style="flex:'+passed+'"></div>'+
      '<div class="seg-fail" style="flex:'+failed+'"></div>'+
      '<div class="seg-pend" style="flex:'+pending+'"></div>';
  }
  document.getElementById('seg-pass-label').textContent=passed+' passed';
  document.getElementById('seg-fail-label').textContent=failed+' failed';
  document.getElementById('seg-pend-label').textContent=pending+' pending';

  // Circular progress
  var circ=document.getElementById('circle-fill');
  var offset=283-(283*pct);
  circ.style.strokeDashoffset=offset;
  document.getElementById('circle-pct').textContent=total?Math.round(pct*100)+'%':'0%';

  // Mini stats
  document.getElementById('ms-passed').textContent=passed;
  document.getElementById('ms-failed').textContent=failed;
  document.getElementById('ms-rate').textContent=total?Math.round(pct*100)+'%':'—';

  // ETA chip
  var etaEl=document.getElementById('eta-chip');
  if(total>0&&done>0&&hb.status==='RUNNING'){
    if(!TASK_START)TASK_START=Date.now();
    var elapsed=(Date.now()-TASK_START)/1000;
    var rate=done/elapsed; // tasks per sec
    var remaining=pending/rate;
    if(remaining>0&&remaining<86400){
      var m=Math.floor(remaining/60), s=Math.round(remaining%60);
      etaEl.innerHTML='<div class="eta-chip">⏱ ETA ~'+m+'m '+s+'s</div>';
    } else { etaEl.innerHTML=''; }
  } else { etaEl.innerHTML=''; if(done===0)TASK_START=null; }

  // Ticker
  var taskId=hb.active_task_id||'';
  var tickerDot=document.getElementById('ticker-dot');
  var tickerText=document.getElementById('ticker-text');
  if(hb.status==='RUNNING'&&taskId){
    if(taskId!==PREV_TASK){PREV_TASK=taskId;}
    tickerDot.style.background='var(--lime)';
    tickerText.style.color='var(--cyan)';
    tickerText.textContent='▶ Solving: '+taskId;
  } else if(hb.status==='ANALYSING'){
    tickerDot.style.background='var(--amber)';
    tickerText.style.color='var(--amber)';
    tickerText.textContent='🔍 Analysing results — preparing Gen '+(hb.active_gen+1)+' spawn…';
  } else if(hb.status==='SPAWNING'){
    tickerDot.style.background='var(--magenta)';
    tickerText.style.color='var(--magenta)';
    tickerText.textContent='🚀 Spawning Generation '+(hb.active_gen+1)+'…';
  } else if(hb.status==='DONE'){
    tickerDot.style.background='var(--cyan)';
    tickerText.style.color='var(--cyan)';
    tickerText.textContent='✅ Generation '+hb.active_gen+' complete — '+passed+' passed, '+failed+' failed';
  } else {
    tickerDot.style.background='var(--dim)';
    tickerText.style.color='var(--dim)';
    tickerText.textContent='Waiting for evolution to start…';
  }

  // Live activity line
  var actWrap=document.getElementById('activity-wrap');
  var actText=document.getElementById('activity-text');
  var actBadges=document.getElementById('activity-badges');
  if(hb.status==='RUNNING'&&hb.current_phase){
    actWrap.style.display='flex';
    actText.textContent=phaseLabel(hb.current_phase);
    actBadges.innerHTML=renderPhaseBadges(hb.phase_results||{});
  } else {
    actWrap.style.display='none';
  }

  // Task phase progress bar
  var phaseBarWrap=document.getElementById('phase-bar-wrap');
  var phaseTaskId=document.getElementById('phase-task-id');
  var phaseSteps=document.getElementById('phase-steps');
  if(hb.status==='RUNNING'&&hb.active_task_id){
    phaseBarWrap.style.display='block';
    var progress2=STATE.genProgress[hb.active_gen]||{};
    var descs2=progress2.descriptions||{};
    phaseTaskId.textContent=descs2[hb.active_task_id]||hb.active_task_id;
    phaseSteps.innerHTML=renderPhaseSteps(hb.current_phase,hb.topology||{});
  } else {
    phaseBarWrap.style.display='none';
  }

}

/* ══ TASK LIST ══ */
function toggleCollapse(gen,e){
  e.stopPropagation();
  if(STATE.collapsed.has(gen)){
    STATE.collapsed.delete(gen);
    STATE.userExpanded.add(gen);
  } else {
    STATE.collapsed.add(gen);
    STATE.userExpanded.delete(gen);
  }
  renderGenDetail(gen);
}

/* Build the task rows HTML only — no card wrapper, embeds inside the gen card */
function renderTaskRows(gen,progress,evoEntry,activeTid){
  var taskList=[],resultsMap={};
  if(progress&&progress.task_list&&progress.task_list.length){
    taskList=progress.task_list;
    Object.keys(progress.results||{}).forEach(function(tid){
      resultsMap[tid]=progress.results[tid];
    });
  } else if(evoEntry&&evoEntry.task_results&&evoEntry.task_results.length){
    taskList=evoEntry.task_results.map(function(r){return r.task_id;});
    evoEntry.task_results.forEach(function(r){resultsMap[r.task_id]=r;});
  }
  if(!taskList.length) return '';

  var descs=(progress&&progress.descriptions)||{};
  var passCount=0,failCount=0,pending=0;
  var rows=taskList.map(function(tid){
    var r=resultsMap[tid];
    var isActive=tid===activeTid;
    var icon,cls;
    if(isActive){
      icon='<div class="spinner spinner-cyan" style="width:11px;height:11px"></div>';
      cls='t-run';
    } else if(r){
      var pass=(r.status==='pass'||r.success===true);
      if(pass){icon='<span style="color:var(--lime)">✓</span>';cls='t-pass';passCount++;}
      else{icon='<span style="color:var(--red)">✗</span>';cls='t-fail';failCount++;}
    } else {
      icon='<span style="opacity:.3">·</span>';cls='t-pend';pending++;
    }
    var label=descs[tid]||tid;
    var errHtml=r&&!isActive&&r.error_type?'<div class="task-err">'+r.error_type+'</div>':'';
    var rtHtml=r&&r.runtime?'<div class="task-rt">'+r.runtime+'s</div>':'';
    var clickHtml='';
    if(r&&cls==='t-fail'){
      var safeRow=JSON.stringify({
        task_id:tid,status:'fail',
        error_type:r.error_type||'',
        agents_used:r.agents_used||[],
        cycles:r.cycles||{}
      }).replace(/"/g,'&quot;');
      clickHtml=' onclick="openDrawer('+safeRow+','+gen+')" style="cursor:pointer"';
    }
    return '<div class="task-row '+cls+'"'+clickHtml+' title="'+tid+'">'+
      '<div class="task-icon">'+icon+'</div>'+
      '<div class="task-id">'+label+'</div>'+
      errHtml+rtHtml+
    '</div>';
  }).join('');

  var isCollapsed=STATE.collapsed.has(gen);
  var summary='<span style="color:var(--lime)">'+passCount+' ✓</span> '+
    '<span style="color:var(--red)">'+failCount+' ✗</span>'+
    (pending?' <span style="color:var(--dim)">'+pending+' pending</span>':'');

  return '<div style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px">'+
    '<div class="collapse-hdr" onclick="toggleCollapse('+gen+',event)" style="margin-bottom:0">'+
      '<div style="font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em">'+
        'Benchmark Tasks &nbsp;<span style="font-weight:400">'+summary+'</span>'+
      '</div>'+
      '<button class="collapse-btn">'+
        (isCollapsed?'▶ Show '+taskList.length:'▼ Collapse')+
      '</button>'+
    '</div>'+
    (isCollapsed?'':'<div class="task-list" style="margin-top:8px;max-height:320px;overflow-y:auto">'+rows+'</div>')+
  '</div>';
}

/* Kept for any callers that pass evoEntry — delegates to renderTaskRows */
function renderTaskList(gen,progress,evoEntry,activeTid){
  return renderTaskRows(gen,progress,evoEntry,activeTid);
}

/* ══ GEN DETAIL ══ */
function renderGenDetail(gen){
  var e=getEvoEntry(gen),hb=STATE.heartbeat,matrix=STATE.benchmarkMatrix;
  var progress=STATE.genProgress[gen]||null;
  var live=hb&&hb.active_gen===gen&&(hb.status==='RUNNING'||hb.status==='ANALYSING'||hb.status==='SPAWNING');
  var activeTid=(hb&&hb.active_gen===gen&&hb.status==='RUNNING')?hb.active_task_id:'';
  var html='';

  if(e){
    // Generation completed — show final overview with task list
    var passed=e.passed||0,total=e.total||0,failed=total-passed;
    var delta=e.improvement_delta;
    var dHtml=delta===null||delta===undefined
      ?'<span class="delta-pend">Awaiting next gen…</span>'
      :delta>=0?'<span class="delta-pos">▲ '+pct(delta)+' vs parent</span>'
              :'<span class="delta-neg">▼ '+pct(Math.abs(delta))+' vs parent</span>';
    html+='<div class="card"><div class="card-title">Generation '+gen+'</div>'+
      '<div class="stat-grid">'+
      '<div class="stat"><div class="stat-val">'+pct(e.pass_rate_actual)+'</div><div class="stat-label">Pass Rate</div></div>'+
      '<div class="stat"><div class="stat-val" style="color:var(--lime)">'+passed+'</div><div class="stat-label">Passed</div></div>'+
      '<div class="stat"><div class="stat-val" style="color:var(--red)">'+failed+'</div><div class="stat-label">Failed</div></div>'+
      '<div class="stat"><div class="stat-val" style="font-size:.9rem;padding-top:8px">'+dHtml+'</div><div class="stat-label">vs Parent</div></div>'+
      '</div>'+
      '</div>';
  } else if(live){
    // Generation running — show live stats + task list
    var parts2=(hb.progress||'0/0').split('/').map(Number);
    var d2=parts2[0]||0,t2=parts2[1]||0;
    var barW2=t2?pct2str(d2/t2):'0%';
    html+='<div class="card"><div class="card-title">Generation '+gen+
      ' <span style="font-size:.6rem;color:var(--lime);font-weight:400">● '+hb.status+'</span></div>'+
      '<div class="stat-grid" style="margin-bottom:16px">'+
      '<div class="stat"><div class="stat-val">'+pct(hb.pass_rate_so_far)+'</div><div class="stat-label">Pass Rate</div></div>'+
      '<div class="stat"><div class="stat-val" style="color:var(--lime)">'+hb.passed_so_far+'</div><div class="stat-label">Passed</div></div>'+
      '<div class="stat"><div class="stat-val" style="color:var(--red)">'+hb.failed_so_far+'</div><div class="stat-label">Failed</div></div>'+
      '<div class="stat"><div class="stat-val" style="font-size:.95rem;color:var(--amber)">'+hb.progress+'</div><div class="stat-label">Progress</div></div>'+
      '</div>'+
      '<div class="big-bar-track" style="margin-bottom:4px"><div class="big-bar-fill" style="width:'+barW2+'"></div></div>'+
      (hb.current_phase?'<div style="font-size:.6rem;color:var(--cyan);margin-top:6px">'+phaseLabel(hb.current_phase)+'</div>':'')+
      '</div>';
  }

  if(e&&e.failure_breakdown&&Object.keys(e.failure_breakdown).length){
    var bd=e.failure_breakdown,maxV=Math.max.apply(null,Object.values(bd));
    var bars=Object.entries(bd).sort(function(a,b){return b[1]-a[1];}).map(function(kv,i){
      var p2=maxV?Math.round(kv[1]/maxV*100):0;
      return '<div class="bd-row"><div class="bd-label">'+kv[0]+'</div>'+
        '<div class="bd-track"><div class="bd-fill" style="width:'+p2+'%;background:'+COLORS[i%COLORS.length]+'"></div></div>'+
        '<div class="bd-count">'+kv[1]+'</div></div>';
    }).join('');
    html+='<div class="card"><div class="card-title">Failure Breakdown by Error Type</div><div class="breakdown">'+bars+'</div></div>';
  }

  if(e&&e.agent_failure_counts&&Object.keys(e.agent_failure_counts).length){
    var items=Object.entries(e.agent_failure_counts).sort(function(a,b){return b[1]-a[1];})
      .map(function(kv){return '<div class="attr-item"><div class="attr-count">'+kv[1]+'</div><div class="attr-name">'+kv[0]+'</div></div>';}).join('');
    html+='<div class="card"><div class="card-title">Agent Failure Attribution</div><div class="attr-grid">'+items+'</div></div>';
  }

  if(matrix&&matrix.matrix&&matrix.gens&&matrix.gens.length>1)html+=renderMatrix(matrix,gen);

  if(e){
    html+='<div class="card"><div class="card-title">Evolution Entry: Gen '+e.from_gen+' → '+e.to_gen+'</div>'+renderEvoEntry(e)+'</div>';
  }

  document.getElementById('gen-detail').innerHTML=html;
}

      var safe=JSON.stringify(r).replace(/"/g,'&quot;');

function renderMatrix(matrix,activeGen){
  var gens=matrix.gens,tasks=matrix.tasks||Object.keys(matrix.matrix);
  var thead='<tr><th>Task</th>'+gens.map(function(g){return '<th>Gen '+g+'</th>';}).join('')+'</tr>';
  var tbody=tasks.map(function(tid){
    var row=matrix.matrix[tid]||{};
    var cells=gens.map(function(g,gi){
      var cell=row[g];if(!cell)return '<td class="m-none">—</td>';
      var prev=gi>0?row[gens[gi-1]]:null;
      var newPass=cell.status==='pass'&&prev&&prev.status==='fail';
      var reg=cell.status==='fail'&&prev&&prev.status==='pass';
      var cls=newPass?'m-new':reg?'m-reg':cell.status==='pass'?'m-pass':'m-fail';
      var lbl=newPass?'✅ new':reg?'⚠️':cell.status==='pass'?'✅':'❌';
      return '<td class="'+cls+'" title="'+(cell.error||'')+'">'+lbl+'</td>';
    }).join('');
    return '<tr><td style="font-size:.6rem;font-family:var(--mono);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+tid+'</td>'+cells+'</tr>';
  }).join('');
  return '<div class="card"><div class="card-title">Cross-Generation Task Matrix</div>'+
    '<div style="font-size:.58rem;color:var(--dim);margin-bottom:10px">'+
    '<span style="color:var(--cyan)">✅ new</span> = first pass this gen &nbsp; <span style="color:var(--amber)">⚠️</span> = regression</div>'+
    '<div class="matrix-wrap"><table class="matrix-table"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div></div>';
}

function renderEvoEntry(e){
  var delta=e.improvement_delta;
  var dStr=delta===null||delta===undefined
    ?'<span class="delta-pend">Pending next gen</span>'
    :delta>=0?'<span class="delta-pos">▲ '+pct(delta)+' improvement</span>'
            :'<span class="delta-neg">▼ '+pct(Math.abs(delta))+' regression</span>';
  var changes=(e.topology_changes||[]).map(function(c){return '<span class="change-tag">'+c+'</span>';}).join('');
  var orig=e.originality||{};
  var origBadge='';
  if(orig.verdict){
    var bClass=orig.verdict==='ORIGINAL'?'pass-pill':orig.verdict==='NEAR_CLONE'?'delta-pend':'fail-pill';
    var scoreStr=typeof orig.originality_score==='number'?(' '+Math.round(orig.originality_score*100)+'% original'):'';
    origBadge='<span class="pill '+bClass+'">🔬 '+orig.verdict+scoreStr+'</span> ';
  }
  return '<div class="evo-header"><div class="evo-title">Gen '+e.from_gen+' → '+e.to_gen+'</div><div>'+dStr+'</div></div>'+
    '<div class="evo-meta">'+origBadge+(e.timestamp||'').slice(0,19).replace('T',' ')+' · '+pct(e.pass_rate_actual)+' pass rate</div>'+
    (changes?'<div class="evo-changes">'+changes+'</div>':'')+
    '<div class="evo-log">'+(e.improvement_log||'—')+'</div>';
}

function openDrawer(row,gen){
  var pass=row.status==='pass';
  var dc=document.getElementById('drawer-content');

  // Base info immediately
  dc.innerHTML=
    '<div style="font-size:1rem;font-weight:800;margin-bottom:4px">'+row.task_id+'</div>'+
    '<div style="font-size:.67rem;color:var(--dim);margin-bottom:20px">Generation '+gen+
    ' · <span class="pill '+(pass?'pass-pill':'fail-pill')+'">'+(pass?'PASS':'FAIL')+'</span>'+
    ' · <a href="/code" target="_blank" style="color:var(--cyan);font-size:.6rem;text-decoration:none">Browse all gen files ↗</a></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px">'+
      '<div><div style="font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Agents Used</div>'+
        '<div style="font-size:.68rem">'+((row.agents_used||[]).join(' → ')||'—')+'</div></div>'+
      '<div><div style="font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Error</div>'+
        '<div style="font-size:.68rem;color:'+(pass?'var(--lime)':'var(--red)')+'">'+( row.error_type||'None')+'</div></div>'+
      '<div><div style="font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Cycles</div>'+
        '<div style="font-size:.68rem">'+Object.entries(row.cycles||{}).map(function(kv){return kv[0]+': '+kv[1];}).join(', ')+'</div></div>'+
    '</div>'+
    '<div style="font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Generated Code</div>'+
    '<div id="code-loading" style="color:var(--dim);font-size:.65rem;font-family:var(--mono);padding:16px">⟳ Loading code…</div>';

  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');

  // Fetch the full result JSON to get final_code
  var url='generations/gen_'+gen+'/results/'+row.task_id+'_result.json';
  fetch(url+'?_='+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .then(function(data){
      var codeEl=document.getElementById('code-loading');
      if(!codeEl)return;
      if(!data||!data.final_code){
        codeEl.textContent='No code found for this task.';
        return;
      }
      var escaped=data.final_code
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // Test results table (expected vs actual)
      var testHtml='';
      if(data.test_results&&data.test_results.length){
        var trows=data.test_results.map(function(tr){
          var ok=tr.passed;
          return '<tr>'+
            '<td style="color:var(--dim);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
              JSON.stringify(tr.input).slice(0,60)+'</td>'+
            '<td style="color:var(--dim)">'+JSON.stringify(tr.expected).slice(0,60)+'</td>'+
            '<td style="color:'+(ok?'var(--lime)':'var(--red)')+'">'+
              (tr.error?'⚠ '+tr.error.slice(0,40):JSON.stringify(tr.actual).slice(0,60))+'</td>'+
            '<td><span class="pill '+(ok?'pass-pill':'fail-pill')+'">'+(ok?'PASS':'FAIL')+'</span></td>'+
          '</tr>';
        }).join('');
        testHtml='<div style="margin-top:16px">'+
          '<div style="font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Test Results</div>'+
          '<table style="font-size:.6rem"><thead><tr>'+
            '<th>Input</th><th>Expected</th><th>Actual</th><th>Status</th>'+
          '</tr></thead><tbody>'+trows+'</tbody></table></div>';
      }

      codeEl.innerHTML=
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
          '<span style="font-size:.55rem;color:var(--dim)">python</span>'+
          '<button onclick="copyCode(this)" data-code="'+data.final_code.replace(/"/g,'&quot;')+'" '+
            'style="background:rgba(0,243,255,.1);border:1px solid rgba(0,243,255,.3);color:var(--cyan);'+
            'border-radius:6px;padding:3px 10px;font-size:.55rem;cursor:pointer;font-family:var(--font)">Copy</button>'+
        '</div>'+
        '<pre style="margin:0;max-height:400px;overflow-y:auto"><code>'+escaped+'</code></pre>'+
        testHtml+
        (data.stderr&&!pass?'<div style="margin-top:14px"><div style="font-size:.55rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Stderr</div><pre style="margin:0;color:var(--red)">'+data.stderr.replace(/</g,'&lt;').slice(0,800)+'</pre></div>':'');
    })
    .catch(function(){
      var el=document.getElementById('code-loading');
      if(el)el.textContent='Could not load code (task result file not found).';
    });
}
function copyCode(btn){
  navigator.clipboard.writeText(btn.dataset.code).then(function(){
    btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy';},1500);
  });
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function pct(v){if(v===null||v===undefined)return '—';return (v*100).toFixed(1)+'%';}
function pct2str(v){return (v*100).toFixed(1)+'%';}
function getKnownGens(){
  var s=new Set();
  STATE.evolutionLog.forEach(function(e){s.add(e.from_gen);s.add(e.to_gen);});
  if(STATE.heartbeat)s.add(STATE.heartbeat.active_gen);
  if(STATE.benchmarkMatrix)(STATE.benchmarkMatrix.gens||[]).forEach(function(g){s.add(Number(g));});
  if(s.size===0)s.add(1);
  return Array.from(s).sort(function(a,b){return a-b;});
}
function getEvoEntry(gen){return STATE.evolutionLog.find(function(e){return e.from_gen===gen;})||null;}
function selectGen(gen){STATE.activeGen=gen;renderAll();}

refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
