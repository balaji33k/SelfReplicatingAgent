name: self-replicating-agent
services:
  - name: dashboard
    type: web
    git:
      branch: main
    build:
      builder: buildpack
    run:
      command: python serve_railway.py
    ports:
      - port: 8080
        protocol: http
    env:
      - key: PORT
        value: "8080"
      - key: GROQ_API_KEY
        secret: GROQ_API_KEY
    instance_type: nano
    scaling:
      min: 1
      max: 1
